databases:
  - name: classos-db
    plan: free
    databaseName: classos
    user: classos

services:
  # One web service serves both the API (/api) and the built SPA (same origin,
  # so the HttpOnly login cookie just works).
  - type: web
    name: classos
    runtime: node
    plan: free
    branch: main
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/db run push &&
      PORT=3000 BASE_PATH=/ pnpm --filter @workspace/classos run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BASE_PATH
        value: /
      - key: STATIC_DIR
        value: artifacts/classos/dist/public
      - key: DATABASE_URL
        fromDatabase:
          name: classos-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
